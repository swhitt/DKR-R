name: macOS policy tests
on: [push, pull_request]
jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned runtime dependencies
        run: |
          python3 scripts/bootstrap_dependencies.py --only n64-modern-runtime --only rt64 --only gekkonet --only monocypher --only libdatachannel --only mbedtls
          bash scripts/apply-dependency-patches.sh
      - name: Configure, build and test
        run: |
          cmake -S runtime-recomp -B build/policy-macos -G Ninja -DCMAKE_BUILD_TYPE=Release -DDKRPORT_ROOT="$PWD" -DDKR_RUNTIME_BUILD_GENERATED=OFF -DDKR_RUNTIME_BUILD_RT64=OFF
          cmake --build build/policy-macos --parallel
          ctest --test-dir build/policy-macos --output-on-failure -R '^DKR'
