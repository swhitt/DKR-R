name: Linux policy tests
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Prepare pinned runtime dependencies
        run: |
          python3 scripts/bootstrap_dependencies.py --only n64-modern-runtime --only rt64 --only gekkonet --only monocypher --only libdatachannel --only mbedtls
          bash scripts/apply-dependency-patches.sh
      - name: Configure, build and test
        run: |
          cmake -S runtime-recomp -B build/policy-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DDKRPORT_ROOT="$PWD" -DDKR_RUNTIME_BUILD_GENERATED=OFF -DDKR_RUNTIME_BUILD_RT64=OFF
          cmake --build build/policy-linux --parallel
          ctest --test-dir build/policy-linux --output-on-failure -R '^DKR'
