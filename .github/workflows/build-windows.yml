name: Windows policy tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned runtime dependencies
        shell: pwsh
        run: |
          python scripts/bootstrap_dependencies.py --only n64-modern-runtime --only rt64 --only gekkonet --only monocypher --only libdatachannel --only mbedtls
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Apply-Dependency-Patches.ps1
      - name: Configure
        shell: pwsh
        run: cmake -S runtime-recomp -B build/policy-windows -G "Visual Studio 17 2022" -A x64 -DDKRPORT_ROOT="$pwd" -DDKR_RUNTIME_BUILD_GENERATED=OFF -DDKR_RUNTIME_BUILD_RT64=OFF
      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build/policy-windows --config Release --parallel
          ctest --test-dir build/policy-windows -C Release --output-on-failure -R '^DKR'
