# The shadow generation pass's fixed-size arrays and their counters, which
# dkr_shadow_polygon_budget and dkr_shadow_clip_budget (custom_tracks_hooks.cpp)
# read: D_8011B118 counts vertices in the 32-slot shadow vertex array, D_8011C230
# polygons in the 32-slot polygon array, D_8011B320[4] the clip points per shadow
# edge (groups of 32 in the 120-entry D_8011B330). D_8011B120 is the vertex array.
schema = 1
header = "shadow_symbols.hpp"
table = "decomp"
hex = "upper"
symbols = [
  "D_8011B118",
  "D_8011B120",
  "D_8011C230",
  "D_8011B320",
]
template = '''#pragma once
#include <stdint.h>
static inline uint32_t dkr_shadow_vertex_count_address(unsigned revision) {
    return revision == 77 ? @D_8011B118:77@ : @D_8011B118:80@;
}
static inline uint32_t dkr_shadow_vertices_address(unsigned revision) {
    return revision == 77 ? @D_8011B120:77@ : @D_8011B120:80@;
}
static inline uint32_t dkr_shadow_polygon_count_address(unsigned revision) {
    return revision == 77 ? @D_8011C230:77@ : @D_8011C230:80@;
}
static inline uint32_t dkr_shadow_edge_point_counts_address(unsigned revision) {
    return revision == 77 ? @D_8011B320:77@ : @D_8011B320:80@;
}
#ifdef __cplusplus
#include <cstdint>
namespace dkr::runtime::shadow_symbols {
struct Symbols {std::uint32_t vertex_count;std::uint32_t vertices;std::uint32_t polygon_count;std::uint32_t edge_point_counts;};
inline constexpr Symbols symbols77{@ALL:77@};
inline constexpr Symbols symbols80{@ALL:80@};
inline constexpr const Symbols& for_revision(bool us_v80) { return us_v80 ? symbols80 : symbols77; }
}
#endif
'''
